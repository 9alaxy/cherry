log_dir: ./mem/layer

experiments:
# gcn
  - name: ogbn_gcn_layer_1
    device_number: 0
    epoch: 5
    fan_out: "10"
    layer: 1
    hid: 256
    data: ogbn-products
    model: GCN
    nb: 1

  - name: ogbn_gcn_layer_2
    device_number: 0
    epoch: 5
    fan_out: "10,25"
    layer: 1
    hid: 256
    data: ogbn-products
    model: GCN
    nb: 1
  
  - name: ogbn_gcn_layer_3
    device_number: 0
    epoch: 5
    fan_out: "10,25,30"
    layer: 1
    hid: 256
    data: ogbn-products
    model: GCN
    nb: 1

  - name: ogbn_gcn_layer_4
    device_number: 0
    epoch: 5
    fan_out: "10,25,30,40"
    layer: 1
    hid: 256
    data: ogbn-products
    model: GCN
    nb: 1

